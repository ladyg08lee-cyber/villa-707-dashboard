`;
const STATUSES = ["Not Started","In Progress","Submitted","Received","Approved","Closed","N/A"];
const SNAG_STATUSES = ["Not Started","Distributed","For distribution","Work In progress","Work Completed","Completed","Coordinated","To be uploaded","For Approval","Approved"];
const STCLASS = {"Not Started":"st-ns","In Progress":"st-ip","Submitted":"st-sb","Received":"st-rc","Approved":"st-ap","N/A":"st-na",
  "Distributed":"st-sb","For distribution":"st-na","Work In progress":"st-ip","Completed":"st-ap","Coordinated":"st-vi","To be uploaded":"st-ns","Closed":"st-ap"};
const DONE = new Set(["Received","Approved","Completed","Coordinated","Closed","Work Completed"]);
const UNSTARTED = new Set(["Not Started",""]);
const isSnag = (r)=> /^04/.test(r.main||"");
const statusesFor = (r)=> isSnag(r)?SNAG_STATUSES:STATUSES;
const ALL_STATUSES = STATUSES.concat(SNAG_STATUSES.filter(s=>!STATUSES.includes(s)));

document.head.insertAdjacentHTML('beforeend','<style>'+CSS+'</style>');

let STATE = [];
try{ STATE = JSON.parse(document.getElementById('app-state').textContent) || []; }catch(e){ STATE=[]; }
let EXTRA_GROUPS = {};
try{const el=document.getElementById('folder-state');if(el)EXTRA_GROUPS=JSON.parse(el.textContent)||{};}catch(e){EXTRA_GROUPS={};}
let META={eyebrow:'Handover Documentation',title:'Villa 707 — Document Master List Tracker',subtitle:'Operational handover-document tracker',footer:'Villa 707 Document Master List Tracker · fäm Interior · Client Handover Document Control'};
try{const el=document.getElementById('meta-state');if(el)META={...META,...JSON.parse(el.textContent)};}catch(e){}
let LAST_UNDO=null,undoTimer=null;
const COLLAPSED=new Set();
STATE.forEach(r=>{EXTRA_GROUPS[r.main]=EXTRA_GROUPS[r.main]||[];if(r.group&&!EXTRA_GROUPS[r.main].includes(r.group))EXTRA_GROUPS[r.main].push(r.group);});

const LSKEY = 'v707_tracker_live_v6';
let syncOnline = true;
let lastSyncTime = 0;

const F = {q:"", folder:"All", group:"All", status:"All", resp:"All"};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shortFolder(m){return m;}
function stats(){
  const t=STATE.length; let done=0,na=0,init=0,ip=0,ipOnly=0,wipOnly=0,faOnly=0,tbuOnly=0,progressed=0,snagWip=0,snagDone=0,snagTotal=0,desnagApproval=0,desnagTotal=0,finalDone=0,finalTotal=0;
  STATE.forEach(r=>{
    if(r.status==="N/A")na++;
    if(DONE.has(r.status))done++;
    if(r.status==="Not Started"||!r.status)init++;
    if(r.status==="In Progress"||r.status==="Work In progress"||r.status==="For Approval"){ip++;if(r.status==="In Progress")ipOnly++;if(r.status==="Work In progress")wipOnly++;if(r.status==="For Approval")faOnly++;}
    if(r.status!=="N/A"&&!UNSTARTED.has(r.status))progressed++;
    if(r.main==="04 – Snagging"&&(r.group||"").startsWith("Snag Report")){snagTotal++;if(r.status==="Work In progress")snagWip++;if(r.status==="Work Completed")snagDone++;}
    if(r.main==="04 – Snagging"&&(r.group||"").startsWith("De-snag")){desnagTotal++;if(r.status==="For Approval")desnagApproval++;}
    if(r.main==="04 – Snagging"&&(r.group||"").startsWith("Approved Final")){finalTotal++;if(r.status==="Approved")finalDone++;}
  });
  const denom=t-na; const pct=denom>0?Math.round(done/denom*100):0;const progressPct=denom>0?Math.round(progressed/denom*100):0;
  return {t,done,na,init,ip,ipOnly,wipOnly,faOnly,tbuOnly,progressed,denom,pct,progressPct,snagWip,snagDone,snagTotal,desnagApproval,desnagTotal,finalDone,finalTotal};
}
function folderStats(){
  const m={};
  STATE.forEach(r=>{const d=(m[r.main]=m[r.main]||{t:0,done:0,na:0,progressed:0});d.t++;if(r.status==="N/A")d.na++;else{if(DONE.has(r.status))d.done++;if(!UNSTARTED.has(r.status))d.progressed++;}});
  return m;
}
function distinctResp(){ return Array.from(new Set(STATE.map(r=>r.resp).filter(Boolean))).sort(); }
function groupsForFolder(){
  const rows=F.folder==='All'?STATE:STATE.filter(r=>r.main===F.folder);
  const stored=F.folder==='All'?Object.values(EXTRA_GROUPS).flat():EXTRA_GROUPS[F.folder]||[];
  return Array.from(new Set(rows.map(r=>r.group).filter(Boolean).concat(stored))).sort();
}
function subfoldersHTML(){
  if(F.folder==='All')return '';
  const groups=groupsForFolder();
  return '<div class="subfolderPanelHead"><h3>Subfolders in '+esc(F.folder)+'</h3><button class="miniBtn" onclick="addSubfolderTo(\''+escAttr(F.folder)+'\')">＋ Add Subfolder</button></div>'
  +(groups.length?'<button class="miniBtn allSubfolders '+(F.group==='All'?'active':'')+'" onclick="selectGroup(\'All\')">View all documents</button><div class="subfolderGrid">'+groups.map(g=>{const count=STATE.filter(r=>r.main===F.folder&&r.group===g).length;return '<div class="subfolderCard '+(F.group===g?'active':'')+'"><p class="subfolderName">'+esc(g)+'</p><p class="subfolderMeta">'+count+' document'+(count===1?'':'s')+'</p><div class="subfolderActions"><button class="miniBtn" onclick="selectGroup(\''+escAttr(g)+'\')">Open</button><button class="miniBtn" onclick="addDocumentTo(\''+escAttr(F.folder)+'\',\''+escAttr(g)+'\')">＋ Add Document</button><button class="miniBtn" onclick="addNestedSubfolder(\''+escAttr(F.folder)+'\',\''+escAttr(g)+'\')">＋ Add Subfolder</button><button class="miniBtn" onclick="renameSubfolder(\''+escAttr(F.folder)+'\',\''+escAttr(g)+'\')">Rename</button><button class="miniBtn danger" onclick="deleteSubfolder(\''+escAttr(F.folder)+'\',\''+escAttr(g)+'\')">Delete</button></div></div>'}).join('')+'</div>':'<p class="secnote">No subfolders yet. Add one using the button above.</p>');
}
function escAttr(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')}
function normalizeDocLink(v){
  let u=String(v||'').trim();
  if(!u)return '';
  if(/^www\./i.test(u))u='https://'+u;
  if(!/^https?:\/\//i.test(u))return '';

/* Normalize any date string to yyyy-MM-dd for <input type="date"> */
function normalizeDate(d){
  if(!d || d==='') return '';
  // Already yyyy-MM-dd
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  // dd/mm/yyyy or dd-mm-yyyy
  let m = d.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  // Full JS Date string like "Thu Jul 09 2026 04:00:00 GMT+0400..."
  try{ const dt=new Date(d); if(!isNaN(dt.getTime())){ const y=dt.getFullYear(),mo=String(dt.getMonth()+1).padStart(2,'0'),dy=String(dt.getDate()).padStart(2,'0'); return y+'-'+mo+'-'+dy; } }catch(e){}
  return '';
}
function normalizeRowDates(rows){
  return rows.map(r=>({...r, date: normalizeDate(r.date)}));
}

  +'<div class="bar"><span style="width:'+p+'%"></span></div><div class="fp"><span class="fm">'+d.t+' items · '+cp+'% complete</span><b class="num">'+p+'% progressed</b></div></div>';}).join('');}

function wireMeta(){document.querySelectorAll('[data-meta]').forEach(el=>el.addEventListener('input',()=>{META[el.getAttribute('data-meta')]=el.textContent.trim();persist()}))}

function printReport(mode){
  if(mode==='current'&&F.folder==='All'){alert('Select a main folder first, then choose PDF · Current folder.');return;}
  const old={...F};
  if(mode==='full'){F.q='';F.folder='All';F.group='All';F.status='All';F.resp='All';}
  else{F.q='';F.group='All';F.status='All';F.resp='All';document.body.classList.add('print-current')}
  render();
  const restoreFn=()=>{document.body.classList.remove('print-current');Object.assign(F,old);render();window.removeEventListener('afterprint',restoreFn)};
  window.addEventListener('afterprint',restoreFn);setTimeout(()=>window.print(),80);
}

function setSave(txt,warn){ const d=document.getElementById('savedot'),t=document.getElementById('savetxt'); if(t)t.textContent=txt; if(d){d.className='dot';if(warn)d.classList.add('warn');} }

/* ═══════════════════════════════════════════════════════════
   GOOGLE SHEETS SYNC ENGINE
   ═══════════════════════════════════════════════════════════ */
let saveTimer=null, saving=false, pendingSave=false, lastEditTime=0;

function persist(){
  // Always save to localStorage as fallback
  try{ localStorage.setItem(LSKEY, JSON.stringify({t:Date.now(), s:STATE, g:EXTRA_GROUPS, m:META})); }catch(e){}
  setSave('Saving…',true);
  const dot=document.getElementById('savedot');
  if(dot)dot.classList.add('syncing');

  pendingSave=true;
  lastEditTime=Date.now();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave, 1200);
}

async function doSave(){
  if(saving){ return; }
  if(!WEBAPP_URL || WEBAPP_URL==='PASTE_YOUR_WEBAPP_URL_HERE'){
    setSave('⚠ No Google Sheets URL configured — saved locally only',true);
    pendingSave=false;
    return;
  }
  saving=true; pendingSave=false;
  try{
    const resp = await fetch(WEBAPP_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({rows:STATE, groups:EXTRA_GROUPS, meta:META})
    });
    const result = await resp.json();
    if(result.error) throw new Error(result.error);
    syncOnline=true;
    lastSyncTime=Date.now();
    setSave('All changes saved to Google Sheets · '+new Date().toLocaleTimeString(),false);
    const banner=document.getElementById('syncBanner');
    if(banner)banner.classList.remove('show');
  }catch(e){
    syncOnline=false;
    setSave('Saved locally — Google Sheets sync failed',true);
    const banner=document.getElementById('syncBanner');
    if(banner)banner.classList.add('show');
  }finally{
    saving=false;
    if(pendingSave){ saveTimer=setTimeout(doSave,800); }
  }
}

async function loadFromSheet(force){
  if(!WEBAPP_URL || WEBAPP_URL==='PASTE_YOUR_WEBAPP_URL_HERE') return false;
  // Don't overwrite local edits unless forced (e.g. boot or manual sync)
  if(!force && (saving || pendingSave || Date.now() - lastEditTime < 30000)) return false;
  try{
    const resp = await fetch(WEBAPP_URL+'?t='+Date.now());
    const data = await resp.json();
    if(data.error) throw new Error(data.error);
    if(data.rows && data.rows.length > 0){
      STATE = data.rows.map((r,i)=>({id:+(r.id)||i+1,main:r.main||'',group:r.group||'',title:r.title||'',status:r.status||'Not Started',resp:r.resp||'',date:normalizeDate(r.date||''),rem:r.rem||'',link:r.link||''}));
      EXTRA_GROUPS = data.groups || {};
      if(data.meta) META = {...META, ...data.meta};
      STATE.forEach(r=>{EXTRA_GROUPS[r.main]=EXTRA_GROUPS[r.main]||[];if(r.group&&!EXTRA_GROUPS[r.main].includes(r.group))EXTRA_GROUPS[r.main].push(r.group);});
      try{ localStorage.setItem(LSKEY, JSON.stringify({t:Date.now(), s:STATE, g:EXTRA_GROUPS, m:META})); }catch(e){}
      syncOnline=true;
      lastSyncTime=Date.now();
      return true;
    }
    return false;
  }catch(e){
    syncOnline=false;
    return false;
  }
}

async function syncNow(){
  setSave('Syncing with Google Sheets…',true);
  const dot=document.getElementById('savedot');
  if(dot)dot.classList.add('syncing');
  // First push local changes
  await doSave();
  // Then pull latest from sheet
  const loaded = await loadFromSheet(true);
  if(loaded){ render(); setSave('Synced with Google Sheets · '+new Date().toLocaleTimeString(),false); }
}

function buildDoc(){
  const json=JSON.stringify(STATE).replace(/<\//g,'<\\/');
  const groupJson=JSON.stringify(EXTRA_GROUPS).replace(/<\//g,'<\\/');
  const metaJson=JSON.stringify(META).replace(/<\//g,'<\\/');
  const app=document.getElementById('app-script').textContent;
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width, initial-scale=1">'
    +'<title>Villa 707 Document Tracker</title>'
    +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700;800&display=swap">'
    +'</head><body>'
    +'<div id="root"></div>'
    +'<script id="app-state" type="application/json">'+json+'<\/script>'
    +'<script id="folder-state" type="application/json">'+groupJson+'<\/script>'
    +'<script id="meta-state" type="application/json">'+metaJson+'<\/script>'
    +'<script id="app-script">'+app+'<\/script>'
    +'</body></html>';
}
function downloadHTML(){
  try{localStorage.setItem(LSKEY,JSON.stringify({t:Date.now(),s:STATE,g:EXTRA_GROUPS,m:META}));}catch(e){}
  const blob=new Blob([buildDoc()],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Villa_707_Interactive_Document_Dashboard.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1200);setSave('Downloaded with latest changes',false);
}

function exportCSV(){
  const head=["No","Main Folder","Section","Document","Status","Responsible","Status Date","Remarks","Document Link"];
  const q=c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')];
  STATE.forEach(r=>lines.push([r.id,r.main,r.group,r.title,r.status,r.resp,r.date,r.rem,r.link||""].map(q).join(',')));
  const data=lines.join('\r\n');
  try{ const b=new Blob([data],{type:'text/csv'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='Villa707_Document_Tracker.csv'; a.click(); URL.revokeObjectURL(u);}catch(e){ alert('Export not available.'); }
}

/* ═══════════════════════════════════════════════════════════
   BOOT — Load from Google Sheets first, fall back to localStorage
   ═══════════════════════════════════════════════════════════ */
(async function boot(){
  // Show loading overlay
  const overlay = document.createElement('div');
  overlay.className='loadingOverlay';
  overlay.innerHTML='<div class="spinner"></div><p style="color:var(--muted);font-size:.85rem">Loading from Google Sheets…</p>';
  document.body.appendChild(overlay);

  // Try loading from Google Sheets
  const loaded = await loadFromSheet(true);

  if(!loaded){
    // Fall back to localStorage
    try{
      const ls=JSON.parse(localStorage.getItem(LSKEY));
      if(ls&&Array.isArray(ls.s)){
        STATE=ls.s.map((r,i)=>({id:+(r.id)||i+1,main:r.main||'',group:r.group||'',title:r.title||'',status:r.status||'Not Started',resp:r.resp||'',date:normalizeDate(r.date||''),rem:r.rem||'',link:r.link||''}));
        EXTRA_GROUPS=ls.g||EXTRA_GROUPS;
        if(ls.m)META={...META,...ls.m};
      }
    }catch(e){}
  }

  render();

  // Remove overlay
  overlay.classList.add('hide');
  setTimeout(()=>overlay.remove(),400);

  // Auto-refresh from Google Sheets every 60 seconds
  setInterval(async ()=>{
    const loaded = await loadFromSheet(false);
    if(loaded) render();
  }, 60000);
})();
